name: Auditor Sonnet 4.6 (reusable)

on:
  workflow_call:
    inputs:
      sensitive_files_path:
        required: true
        type: string
        description: "Path to sensitive-files.yml in the consumer repo"
      max_cost_usd:
        required: false
        type: number
        default: 0.10
        description: "Hard cap per PR in USD"
      orchestration_ref:
        required: false
        type: string
        default: "main"
        description: "Branch/tag of flora-ai-orchestration to use"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ZAPI_INSTANCE_ID:
        required: false
      ZAPI_INSTANCE_TOKEN:
        required: false
      ZAPI_CLIENT_TOKEN:
        required: false
      WHATSAPP_NOTIFY_TO:
        required: false
      WHATSAPP_NOTIFY_ENABLED:
        required: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      verdict: ${{ steps.audit.outputs.verdict }}
      risk: ${{ steps.audit.outputs.risk }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout orchestration template
        uses: actions/checkout@v4
        with:
          repository: FloemaIndustria/flora-ai-orchestration
          ref: ${{ inputs.orchestration_ref }}
          path: .orchestration
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r .orchestration/scripts/requirements.txt

      - name: Get PR diff and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > diff.txt
          gh pr view ${{ github.event.pull_request.number }} \
            --json title,body,additions,deletions,changedFiles,author \
            > pr_meta.json

      - name: Run auditor
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python .orchestration/scripts/call_auditor.py \
            --diff diff.txt \
            --pr-meta pr_meta.json \
            --sensitive ${{ inputs.sensitive_files_path }} \
            --prompt .orchestration/prompts/auditor-system.md \
            --max-cost-usd ${{ inputs.max_cost_usd }} \
            --output verdict.json \
            --comment-output comment.md

      - name: Post verdict comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -F comment.md

      - name: Apply review (approve)
        if: steps.audit.outputs.verdict == 'approve'
        continue-on-error: true   # GitHub bloqueia self-review (autor == actor); verdict comment é suficiente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve \
            --body "Auto-approved by Sonnet 4.6 auditor." || \
          echo "::notice::Self-review bloqueado pelo GitHub (autor==github-actions[bot]). Verdict comment acima vale como aprovação."

      - name: Apply review (request changes)
        if: steps.audit.outputs.verdict == 'request_changes'
        continue-on-error: true   # mesmo motivo: self-review bloqueio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --request-changes \
            --body "Changes requested by Sonnet 4.6 auditor. See verdict comment above." || \
          echo "::notice::Self-review bloqueado pelo GitHub (autor==github-actions[bot]). Verdict comment acima sinaliza changes requested."

      - name: Notify WhatsApp on needs_human
        if: steps.audit.outputs.verdict == 'needs_human'
        continue-on-error: true   # best-effort: nunca bloqueia auditor
        env:
          WHATSAPP_NOTIFY_ENABLED: ${{ secrets.WHATSAPP_NOTIFY_ENABLED }}
          ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
          ZAPI_TOKEN: ${{ secrets.ZAPI_INSTANCE_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          WHATSAPP_NOTIFY_TO: ${{ secrets.WHATSAPP_NOTIFY_TO }}
        run: |
          PR_TITLE=$(python3 -c "import json; print(json.load(open('pr_meta.json'))['title'])")
          python3 .orchestration/scripts/whatsapp_notify.py \
            --repo "${{ github.repository }}" \
            --workflow "Auditor Sonnet 4.6" \
            --conclusion "needs_human" \
            --branch "${{ github.head_ref }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --verdict-json verdict.json \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-title "$PR_TITLE"

      - name: Upload verdict artifact
        uses: actions/upload-artifact@v4
        with:
          name: auditor-verdict
          path: |
            verdict.json
            comment.md
          retention-days: 30
